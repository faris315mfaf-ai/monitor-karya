<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anda sedang luring — Monitor Karya</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73;
      --line: #e5e5ea; --merah: #d11a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #050506; --surface: #131316; --ink: #f5f5f7; --ink-2: #98989d; --line: #26262a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .kartu {
      max-width: 420px; width: 100%; background: var(--surface);
      border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; text-align: center;
    }
    .ikon {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--merah) 12%, var(--surface)); color: var(--merah);
    }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 8px; color: var(--ink-2); }
    p.terakhir { font-size: 13px; margin-bottom: 20px; }
    .tombol {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 0 20px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--merah); color: #fff; font: 600 15px inherit; letter-spacing: -0.005em;
    }
    .tombol:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: no-preference) { .tombol { transition: transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1); } }
  </style>
</head>
<body>
  <main class="kartu">
    <div class="ikon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l18 18" /><path d="M5.6 8.6C4 9.8 3 11.4 3 12.5 3 17 7 20 12 20c1.5 0 2.9-.3 4.1-.8" />
        <path d="M19.5 15.7c1-.9 1.5-2.1 1.5-3.2C21 8 17 5 12 5c-.7 0-1.4.1-2 .2" />
      </svg>
    </div>
    <h1>Anda sedang luring</h1>
    <p>Koneksi ke server Monitor Karya terputus. Halaman yang pernah Anda buka masih bisa dibaca dari simpanan perangkat; laporan dan perubahan data perlu menunggu koneksi kembali.</p>
    <p class="terakhir" id="terakhir"></p>
    <button class="tombol" type="button" onclick="location.replace('/')">Coba lagi</button>
  </main>
  <script>
    try {
      var t = document.getElementById('terakhir')
      var m = new Date()
      t.textContent = 'Terakhir memeriksa koneksi: ' +
        new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit' }).format(m) + ' WIB'
      addEventListener('online', function () { location.replace('/') })
    } catch (e) { /* halaman tetap berguna tanpa skrip */ }
  </script>
</body>
</html>
