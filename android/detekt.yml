# Detekt ringan Fase 0: jaga kompleksitas; format serahkan ke ktlint.
# Dipakai semua modul lewat buildUponDefaultConfig = true.

build:
  maxIssues: 50 # toleransi masa skeleton, rapatkan menuju 0

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LargeClass:
    active: true
    threshold: 700
  LongMethod:
    active: true
    threshold: 100
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 12
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 20
    thresholdInInterfaces: 12
    thresholdInObjects: 20
    thresholdInEnums: 12
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true

formatting:
  active: false # ktlint sudah memformat; detekt tidak mendobel
