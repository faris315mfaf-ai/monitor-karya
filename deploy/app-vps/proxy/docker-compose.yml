# Caddy bersama untuk semua proyek di VPS ini. Sertifikat HTTPS otomatis
# (Let's Encrypt). Satu-satunya kontainer yang membuka port ke internet.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
