<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="judul ket"><title id="judul">Siklus status output</title><desc id="ket">Output: Dikerjakan, Menunggu review, Perlu revisi, Diterima, beserta siapa yang mengubah.</desc><defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/></marker></defs><rect x="0" y="0" width="1120" height="300" rx="18" fill="#F5F5F7"/><text x="32" y="44" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">Siklus status output (model Output, migrasi 0013)</text><rect x="60" y="90" width="200" height="62" rx="12" fill="#E6F4EA" stroke="#1E7B34" stroke-width="1"/><text x="160" y="117" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E7B34" text-anchor="middle">Dikerjakan</text><text x="160" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="middle">DIKERJAKAN</text><rect x="330" y="90" width="200" height="62" rx="12" fill="#E7EFFA" stroke="#1F5FAD" stroke-width="1"/><text x="430" y="117" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F5FAD" text-anchor="middle">Menunggu review</text><text x="430" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="middle">MENUNGGU_REVIEW</text><rect x="640" y="90" width="200" height="62" rx="12" fill="#FAFAFB" stroke="#48484A" stroke-width="1"/><text x="740" y="117" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#48484A" text-anchor="middle">Diterima</text><text x="740" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="middle">DITERIMA</text><rect x="330" y="200" width="200" height="62" rx="12" fill="#FFF3DC" stroke="#8A5300" stroke-width="1"/><text x="430" y="227" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A5300" text-anchor="middle">Perlu revisi</text><text x="430" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="middle">PERLU_REVISI</text><line x1="260" y1="112" x2="330" y2="112" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#panah)"/><rect x="207.0" y="72" width="176" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="295" y="84" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">PIC: submit (min. 1 bukti)</text><line x1="330" y1="132" x2="260" y2="132" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#panah)"/><rect x="229.5" y="138" width="131" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="295" y="150" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">withdraw / Urungkan</text><line x1="530" y1="121" x2="640" y2="121" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#panah)"/><rect x="538.5" y="98" width="93" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="585" y="110" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">Kadiv: accept</text><line x1="430" y1="152" x2="430" y2="200" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#panah)"/><rect x="276.5" y="168" width="157" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="355" y="180" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">Kadiv: revise + catatan</text><path d="M330,231 Q245.0,221.5 160,152" fill="none" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#panah)"/><rect x="157.0" y="218" width="106" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="210" y="230" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">PIC memperbaiki</text><line x1="640" y1="141" x2="530" y2="141" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#panah)"/><rect x="532.0" y="153" width="106" height="17" rx="4" fill="#F5F5F7" opacity="0.92"/><text x="585" y="165" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#48484A" text-anchor="middle">undo ≤ 15 menit</text><line x1="530" y1="220" x2="500" y2="152" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#panah)"/><text x="545" y="245" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="start">undo dari Perlu revisi juga kembali ke Menunggu review</text><text x="870" y="110" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#48484A" text-anchor="start">Bukti dibekukan saat</text><text x="870" y="126" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#48484A" text-anchor="start">Menunggu review &amp; Diterima.</text><text x="870" y="150" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#48484A" text-anchor="start">Hapus hanya bila belum</text><text x="870" y="166" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#48484A" text-anchor="start">ada bukti &amp; belum diterima.</text></svg>
