<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="judul ket"><title id="judul">Pola Sheet di tiga ukuran</title><desc id="ket">Detail dibuka di Sheet: samping 440 di desktop, form sheet di tablet, layar didorong di ponsel.</desc><defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/></marker></defs><rect x="0" y="0" width="1120" height="520" rx="18" fill="#F5F5F7"/><text x="32" y="44" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">Pola detail: Sheet (src/components/mk/sheet.tsx)</text><text x="32" y="66" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#48484A" text-anchor="start">Detail tidak pindah halaman. Fokus masuk ke judul, Esc menutup, fokus kembali ke pembuka; di ponsel geser dari tepi kiri untuk menutup.</text><rect x="32" y="92" width="480" height="340" rx="12" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/><rect x="42" y="102" width="220" height="320" rx="8" fill="#FAFAFB" stroke="#E5E5EA" stroke-width="1"/><rect x="32" y="92" width="480" height="340" rx="12" fill="#1D1D1F" opacity="0.08"/><rect x="322" y="98" width="184" height="328" rx="12" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/><text x="334" y="122" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" text-anchor="start">Judul detail</text><rect x="334" y="138" width="160" height="18" rx="4" fill="#FAFAFB"/><rect x="334" y="166" width="160" height="18" rx="4" fill="#FAFAFB"/><rect x="334" y="194" width="160" height="18" rx="4" fill="#FAFAFB"/><rect x="334" y="222" width="160" height="18" rx="4" fill="#FAFAFB"/><rect x="334" y="250" width="160" height="18" rx="4" fill="#FAFAFB"/><rect x="334" y="384" width="70" height="26" rx="13" fill="#FAFAFB" stroke="#D1D1D6" stroke-width="1"/><rect x="412" y="384" width="82" height="26" rx="13" fill="#B3261E"/><text x="453" y="401" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Simpan</text><text x="272" y="454" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6E6E73" text-anchor="middle">Desktop: samping kanan 440 px (wide 640–680)</text><rect x="548" y="92" width="300" height="340" rx="12" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/><rect x="548" y="92" width="300" height="340" rx="12" fill="#1D1D1F" opacity="0.08"/><rect x="578" y="132" width="240" height="270" rx="16" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/><text x="592" y="156" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" text-anchor="start">Form sheet</text><rect x="592" y="172" width="212" height="18" rx="4" fill="#FAFAFB"/><rect x="592" y="200" width="212" height="18" rx="4" fill="#FAFAFB"/><rect x="592" y="228" width="212" height="18" rx="4" fill="#FAFAFB"/><rect x="592" y="256" width="212" height="18" rx="4" fill="#FAFAFB"/><rect x="592" y="284" width="212" height="18" rx="4" fill="#FAFAFB"/><rect x="718" y="364" width="86" height="26" rx="13" fill="#B3261E"/><text x="698" y="454" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6E6E73" text-anchor="middle">Tablet 600–1023: form sheet di tengah</text><rect x="884" y="92" width="200" height="340" rx="22" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/><text x="900" y="122" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E" text-anchor="start">‹ Kembali</text><text x="900" y="148" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D1D1F" text-anchor="start">Judul detail</text><rect x="900" y="164" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="192" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="220" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="248" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="276" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="304" width="168" height="18" rx="4" fill="#FAFAFB"/><rect x="900" y="388" width="168" height="28" rx="14" fill="#B3261E"/><text x="984" y="454" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6E6E73" text-anchor="middle">Ponsel &lt;600: layar didorong</text><text x="32" y="490" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">Hapus selalu lewat useConfirm (src/components/companies/parts.tsx); tindakan yang bisa dibalik memakai toast "Urungkan" (sonner).</text></svg>
